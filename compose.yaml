# 실행: ./start-msa.sh  (또는 ./gradlew bootJar && docker compose up -d --build)
# 외부 진입점은 API Gateway(8080)와 Eureka 대시보드(8761)뿐이다. 도메인 서비스는 내부 네트워크에서만 접근한다.
name: tspoon

x-java-service: &java-service
  restart: unless-stopped
  networks:
    - tspoon-network
  deploy:
    resources:
      limits:
        memory: 512M

x-domain-service-env: &domain-service-env
  DB_HOST: postgres
  DB_USERNAME: ${POSTGRES_USER:-tspoon}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-tspoon}
  EUREKA_URL: http://eureka-server:8761/eureka/
  JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-change-me-0123456789}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

x-redis-env: &redis-env
  REDIS_HOST: redis

x-domain-service-depends-on: &domain-service-depends-on
  postgres:
    condition: service_healthy
  eureka-server:
    condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tspoon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tspoon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 이미지부터 데이터 경로가 /var/lib/postgresql/18/docker 로 바뀌어 상위 디렉터리를 마운트한다
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - tspoon-network

  # Refresh Token · 로그아웃 차단 목록 · 토큰 버전 (user-service 가 쓰고 api-gateway 가 확인)
  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - tspoon-network

  # 서비스 간 이벤트 (community·qna 가 outbox 로 발행 → notification 이 소비). KRaft 단일 노드
  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # 컨테이너끼리는 kafka:9092, 호스트(IDE)에서는 localhost:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped
    networks:
      - tspoon-network

  # 통합 검색 색인 — 한국어 형태소 분석기(nori)를 넣은 이미지 (docker/opensearch)
  opensearch:
    image: tspoon/opensearch
    build: docker/opensearch
    environment:
      discovery.type: single-node
      # 로컬 전용 — 운영에서는 보안 플러그인(TLS·인증)을 켠다
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    networks:
      - tspoon-network

  # 첨부파일·썸네일 저장소 — S3 호환 (SeaweedFS). 클라이언트는 Presigned URL 로 여기와 직접 주고받는다
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    # 기본은 컨테이너 IP 에만 바인딩해 컨테이너 안 헬스체크(localhost)가 닿지 않으므로 모든 주소에서 받는다
    command: ["server", "-ip.bind=0.0.0.0", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
      # 로컬 전용 S3 계정 — 운영에서는 비밀 저장소에서 넣는다
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped
    networks:
      - tspoon-network

  # 이메일 알림 확인용 메일 캡처 서버 — 보낸 메일은 http://localhost:8025 에서 본다
  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped
    networks:
      - tspoon-network

  eureka-server:
    <<: *java-service
    image: tspoon/eureka-server
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { SERVICE: eureka-server, PORT: 8761 }
    environment:
      EUREKA_HOSTNAME: eureka-server
    ports:
      - "8761:8761"

  api-gateway:
    <<: *java-service
    image: tspoon/api-gateway
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { SERVICE: api-gateway, PORT: 8080 }
    environment:
      <<: *redis-env
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-change-me-0123456789}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    <<: *java-service
    image: tspoon/user-service
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { SERVICE: user-service, PORT: 8081 }
    environment:
      <<: [*domain-service-env, *redis-env]
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      <<: *domain-service-depends-on
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  community-service:
    <<: *java-service
    image: tspoon/community-service
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { SERVICE: community-service, PORT: 8082 }
    environment: *domain-service-env
    depends_on:
      <<: *domain-service-depends-on
      kafka:
        condition: service_healthy

  education-service:
    <<: *java-service
    image: tspoon/education-service
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { SERVICE: education-service, PORT: 8083 }
    environment: *domain-service-env
    depends_on:
      <<: *domain-service-depends-on
      kafka:
        condition: service_healthy

  qna-service:
    <<: *java-service
    image: tspoon/qna-service
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { SERVICE: qna-service, PORT: 8084 }
    environment: *domain-service-env
    depends_on:
      <<: *domain-service-depends-on
      kafka:
        condition: service_healthy

  event-service:
    <<: *java-service
    image: tspoon/event-service
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { SERVICE: event-service, PORT: 8085 }
    environment: *domain-service-env
    depends_on:
      <<: *domain-service-depends-on
      kafka:
        condition: service_healthy

  notification-service:
    <<: *java-service
    image: tspoon/notification-service
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { SERVICE: notification-service, PORT: 8086 }
    environment:
      <<: [*domain-service-env, *redis-env]
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
    depends_on:
      <<: *domain-service-depends-on
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 통합 검색 — DB 없이 이벤트로 OpenSearch 색인을 갱신한다
  search-service:
    <<: *java-service
    image: tspoon/search-service
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { SERVICE: search-service, PORT: 8087 }
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-change-me-0123456789}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENSEARCH_URL: http://opensearch:9200
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  # 파일 업로드 — 업로드·내려받기 URL 을 발급하고 올라간 파일을 확인한다
  file-service:
    <<: *java-service
    image: tspoon/file-service
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { SERVICE: file-service, PORT: 8088 }
    environment:
      <<: *domain-service-env
      FILE_STORAGE_ENDPOINT: http://seaweedfs:8333
      # Presigned URL 은 호스트(브라우저·E2E)가 닿는 주소로 만든다
      FILE_STORAGE_PUBLIC_ENDPOINT: http://localhost:${SEAWEEDFS_S3_PORT:-8333}
    depends_on:
      <<: *domain-service-depends-on
      seaweedfs:
        condition: service_healthy

volumes:
  postgres-data:
  seaweedfs-data:

networks:
  tspoon-network:
