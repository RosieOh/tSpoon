version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: tspoon-postgres
    environment:
      POSTGRES_DB: tspoon
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tspoon-network

  # Eureka Server
  eureka-server:
    build:
      context: .
      dockerfile: services/eureka-server/Dockerfile
    container_name: tspoon-eureka-server
    ports:
      - "8761:8761"
    networks:
      - tspoon-network
    depends_on:
      - postgres

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: tspoon-api-gateway
    ports:
      - "8080:8080"
    networks:
      - tspoon-network
    depends_on:
      - eureka-server

  # User Service
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: tspoon-user-service
    ports:
      - "8081:8081"
    networks:
      - tspoon-network
    depends_on:
      - postgres
      - eureka-server
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tspoon
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234

  # Community Service
  community-service:
    build:
      context: .
      dockerfile: services/community-service/Dockerfile
    container_name: tspoon-community-service
    ports:
      - "8082:8082"
    networks:
      - tspoon-network
    depends_on:
      - postgres
      - eureka-server
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tspoon
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234

  # Education Service
  education-service:
    build:
      context: .
      dockerfile: services/education-service/Dockerfile
    container_name: tspoon-education-service
    ports:
      - "8083:8083"
    networks:
      - tspoon-network
    depends_on:
      - postgres
      - eureka-server
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tspoon
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234

  # QnA Service
  qna-service:
    build:
      context: .
      dockerfile: services/qna-service/Dockerfile
    container_name: tspoon-qna-service
    ports:
      - "8084:8084"
    networks:
      - tspoon-network
    depends_on:
      - postgres
      - eureka-server
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tspoon
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234

  # Event Service
  event-service:
    build:
      context: .
      dockerfile: services/event-service/Dockerfile
    container_name: tspoon-event-service
    ports:
      - "8085:8085"
    networks:
      - tspoon-network
    depends_on:
      - postgres
      - eureka-server
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tspoon
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: tspoon-notification-service
    ports:
      - "8086:8086"
    networks:
      - tspoon-network
    depends_on:
      - postgres
      - eureka-server
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tspoon
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234

volumes:
  postgres_data:

networks:
  tspoon-network:
    driver: bridge
