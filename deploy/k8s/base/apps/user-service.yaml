# user-service — 회원·인증·토큰
apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      # Service 마다 자동으로 들어오는 REDIS_PORT=tcp://… 같은 변수가 앱 설정(REDIS_PORT 등)을 덮어쓰지 않게 한다
      enableServiceLinks: false
      initContainers:
        # 의존 서비스가 받을 준비가 될 때까지 기다려 기동 실패·재시작 반복을 줄인다
        - name: wait-for-dependencies
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              for dep in postgres:5432 redis:6379; do
                until nc -z "${dep%:*}" "${dep#*:}"; do echo "waiting for $dep"; sleep 2; done
              done
      containers:
        - name: app
          image: tspoon/user-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: tspoon-config
            - secretRef:
                name: tspoon-secrets
          env:
            # 초기 관리자 계정 정보는 user-service 에만 준다
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: tspoon-admin
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tspoon-admin
                  key: ADMIN_PASSWORD
          # Spring Boot Actuator 프로브 (기동이 끝날 때까지는 startupProbe 만 본다)
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
