# tSpoon 공통 매니페스트. 환경별 비밀값·노출 방식은 overlays 에서 정한다 (로컬: overlays/kind)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tspoon
labels:
  - pairs:
      app.kubernetes.io/part-of: tspoon

resources:
  - namespace.yaml
  - infra/postgres.yaml
  - infra/redis.yaml
  - infra/kafka.yaml
  - infra/mailpit.yaml
  - infra/opensearch.yaml
  - apps/api-gateway.yaml
  - apps/user-service.yaml
  - apps/community-service.yaml
  - apps/education-service.yaml
  - apps/qna-service.yaml
  - apps/event-service.yaml
  - apps/notification-service.yaml
  - apps/search-service.yaml

configMapGenerator:
  - name: tspoon-config
    literals:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - OPENSEARCH_URL=http://opensearch:9200
      # 메일 속 링크(이메일 인증 등)가 가리킬 웹 주소 — 운영 overlay 에서 실제 주소로 바꾼다
      - WEB_BASE_URL=http://localhost:3000
      # Kubernetes 에서는 Service DNS·kube-proxy 가 서비스를 찾고 나눠 주므로 Eureka 를 쓰지 않는다
      - EUREKA_CLIENT_ENABLED=false
      # Gateway 라우트 주소 (기본값 lb:// 대신 Service DNS)
      - USER_SERVICE_URI=http://user-service:8081
      - COMMUNITY_SERVICE_URI=http://community-service:8082
      - EDUCATION_SERVICE_URI=http://education-service:8083
      - QNA_SERVICE_URI=http://qna-service:8084
      - EVENT_SERVICE_URI=http://event-service:8085
      - NOTIFICATION_SERVICE_URI=http://notification-service:8086
      - SEARCH_SERVICE_URI=http://search-service:8087
  # docker compose 와 같은 init 스크립트를 쓴다 (빌드할 때 --load-restrictor LoadRestrictionsNone 필요)
  - name: postgres-init
    files:
      - 01-create-databases.sql=../../../docker/postgres/init/01-create-databases.sql
