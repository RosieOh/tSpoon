# 공통 기본값(가상 스레드, JPA, Eureka, Actuator, JWT)은 core-service 의 tspoon-defaults.yml 참고
server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/user_db
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

tspoon:
  security:
    public-paths:
      - /api/users/register
      - /api/users/login
      - /api/users/token/refresh
      - /api/users/email-verification/confirm
      - /api/users/email-verification/resend
      - /api/users/password-reset/request
      - /api/users/password-reset/confirm
  # 인증 링크 유효 시간 · 재발송 대기 · 미인증 가입 보관 기간 (EmailVerificationProperties)
  user:
    email-verification:
      token-ttl: ${EMAIL_VERIFICATION_TOKEN_TTL:24h}
      resend-cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN:1m}
      unverified-retention: ${UNVERIFIED_USER_RETENTION:7d}
    # 재설정 링크 유효 시간 · 재요청 대기 (PasswordResetProperties)
    password-reset:
      token-ttl: ${PASSWORD_RESET_TOKEN_TTL:30m}
      request-cooldown: ${PASSWORD_RESET_REQUEST_COOLDOWN:1m}
  # 둘 다 있고 관리자가 한 명도 없을 때만 기동 시 관리자 계정을 만든다
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

logging:
  level:
    com.tspoon: DEBUG
