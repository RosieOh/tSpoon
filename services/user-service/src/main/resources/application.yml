# 공통 기본값(가상 스레드, JPA, Eureka, Actuator, JWT)은 core-service 의 tspoon-defaults.yml 참고
server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/user_db
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

tspoon:
  security:
    public-paths:
      - /api/users/register
      - /api/users/login
      - /api/users/token/refresh
      - /api/users/email-verification/confirm
      - /api/users/email-verification/resend
      - /api/users/password-reset/request
      - /api/users/password-reset/confirm
      - /api/users/oauth/**
  # 인증 링크 유효 시간 · 재발송 대기 · 미인증 가입 보관 기간 (EmailVerificationProperties)
  user:
    email-verification:
      token-ttl: ${EMAIL_VERIFICATION_TOKEN_TTL:24h}
      resend-cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN:1m}
      unverified-retention: ${UNVERIFIED_USER_RETENTION:7d}
    # 연속 로그인 실패 잠금 (LoginLockProperties)
    login-lock:
      max-failures: ${LOGIN_LOCK_MAX_FAILURES:5}
      window: ${LOGIN_LOCK_WINDOW:15m}
      lock-duration: ${LOGIN_LOCK_DURATION:15m}
    # 소셜 로그인 (OAuthProperties) — client-id 를 넣은 제공자만 켜진다. redirect-uri 는 제공자에 등록한 주소
    oauth:
      providers:
        kakao:
          client-id: ${KAKAO_CLIENT_ID:}
          client-secret: ${KAKAO_CLIENT_SECRET:}
          redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/oauth/kakao}
          token-uri: https://kauth.kakao.com/oauth/token
          user-info-uri: https://kapi.kakao.com/v2/user/me
        naver:
          client-id: ${NAVER_CLIENT_ID:}
          client-secret: ${NAVER_CLIENT_SECRET:}
          redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:3000/oauth/naver}
          token-uri: https://nid.naver.com/oauth2.0/token
          user-info-uri: https://openapi.naver.com/v1/nid/me
    # 재설정 링크 유효 시간 · 재요청 대기 (PasswordResetProperties)
    password-reset:
      token-ttl: ${PASSWORD_RESET_TOKEN_TTL:30m}
      request-cooldown: ${PASSWORD_RESET_REQUEST_COOLDOWN:1m}
  # 둘 다 있고 관리자가 한 명도 없을 때만 기동 시 관리자 계정을 만든다
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

logging:
  level:
    com.tspoon: DEBUG
