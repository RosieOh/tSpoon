# 공통 기본값(가상 스레드, JPA, Eureka, Actuator, JWT)은 core-service 의 tspoon-defaults.yml 참고
server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/user_db

tspoon:
  security:
    public-paths:
      - /api/users/register
      - /api/users/login
  # 둘 다 있고 관리자가 한 명도 없을 때만 기동 시 관리자 계정을 만든다
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

logging:
  level:
    com.tspoon: DEBUG
