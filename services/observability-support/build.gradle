// 관측성(추적·메트릭·로그) 공통 의존성과 설정. 도메인 서비스(core-service 경유)와 api-gateway 가 함께 쓴다.
// OTLP 수집기 주소를 설정할 때만 내보내므로, 수집기 없이 실행해도 경고가 쌓이지 않는다.
plugins {
    id 'tspoon.java-library'
}

dependencies {
    // Micrometer Tracing(OpenTelemetry 브리지) + OTLP 트레이스·로그 익스포터 + OTLP 메트릭 레지스트리
    api 'org.springframework.boot:spring-boot-starter-opentelemetry'

    // Logback 로그를 OpenTelemetry 로 넘기는 어펜더 (Boot 가 자동으로 붙이지 않는다)
    implementation libs.opentelemetry.logback.appender

    annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'
}
