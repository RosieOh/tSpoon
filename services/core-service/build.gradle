// 도메인 서비스들이 공유하는 라이브러리: JWT 인증, Security 기본 설정, 공통 예외/응답 포맷
plugins {
    id 'tspoon.java-library'
    id 'java-test-fixtures'
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-webmvc'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework:spring-tx' // DataIntegrityViolationException 처리용

    // JWT 발급·검증 (api-gateway 와 같은 구현을 쓴다)
    api project(':services:auth-support')

    // 서비스별 OpenAPI 문서(/v3/api-docs). Swagger UI 는 api-gateway 에서 모아 보여 준다
    api libs.springdoc.webmvc.api

    annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // 도메인 서비스 테스트가 공유하는 PostgreSQL Testcontainers 설정
    testFixturesApi 'org.springframework.boot:spring-boot-test'
    testFixturesApi 'org.springframework.boot:spring-boot-testcontainers'
    testFixturesApi 'org.testcontainers:testcontainers-postgresql'
    testFixturesApi 'org.testcontainers:testcontainers-kafka'
    testFixturesImplementation 'org.apache.kafka:kafka-clients'
}
