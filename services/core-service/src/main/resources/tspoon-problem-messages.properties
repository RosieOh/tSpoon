# Spring MVC 표준 예외의 ProblemDetail detail 한국어 문구 (ResponseEntityExceptionHandler 가 메시지 코드로 찾는다)
# 형식: problemDetail.<예외 클래스 전체 이름>=문구, {0} {1} 은 예외가 넘기는 인자
problemDetail.org.springframework.beans.TypeMismatchException=''{0}'' 의 값 ''{1}'' 이(가) 올바르지 않습니다.
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=요청 본문을 읽을 수 없습니다. JSON 형식을 확인해 주세요.
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException={0} 메서드는 지원하지 않습니다.
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=지원하지 않는 Content-Type 입니다.
problemDetail.org.springframework.web.bind.MissingServletRequestParameterException=필수 파라미터 ''{0}'' 이(가) 없습니다.
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=요청한 경로를 찾을 수 없습니다.
