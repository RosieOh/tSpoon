# 도메인 서비스 공통 기본값 (우선순위 최하위)
# 각 서비스 application.yml 이나 환경변수에 같은 키가 있으면 그 값이 우선한다.
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    username: ${DB_USERNAME:tspoon}
    password: ${DB_PASSWORD:tspoon}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(db/migration)가 만들고, Hibernate 는 엔티티와 맞는지 검증만 한다
      ddl-auto: validate
  messages:
    # 표준 예외의 한국어 에러 문구 (core-service 의 tspoon-problem-messages.properties)
    # 서비스가 자체 messages.properties 를 두면 basename: messages,tspoon-problem-messages 로 함께 적는다
    basename: tspoon-problem-messages
  autoconfigure:
    exclude:
      # JWT 로만 인증하므로 Boot 가 만드는 기본 in-memory 사용자(랜덤 비밀번호)는 필요 없다
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      # 로컬·학습용으로 모든 요청을 추적한다. 운영에서는 낮춘다 (MANAGEMENT_TRACING_SAMPLING_PROBABILITY)
      probability: 1.0
  otlp:
    metrics:
      export:
        # OTLP 수집기가 있을 때만 켠다 (compose.observability.yaml). 트레이스·로그는 주소를 줄 때만 내보낸다
        enabled: false

tspoon:
  jwt:
    # 로컬 개발 전용 기본값. docker compose / 운영 환경에서는 환경변수 JWT_SECRET 으로 반드시 교체한다.
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-0123456789}
    access-token-ttl: 30m
    refresh-token-ttl: 14d
