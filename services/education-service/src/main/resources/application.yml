# 공통 기본값(가상 스레드, JPA, Eureka, Actuator, JWT)은 core-service 의 tspoon-defaults.yml 참고
server:
  port: 8083

spring:
  application:
    name: education-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/education_db

tspoon:
  security:
    # 목록·상세만 공개 (/api/contents/bookmarks/me 처럼 두 단계 이상인 경로는 로그인 필요)
    public-get-paths:
      - /api/contents
      - /api/contents/*

logging:
  level:
    com.tspoon: DEBUG
