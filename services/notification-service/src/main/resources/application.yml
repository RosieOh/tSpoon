# 공통 기본값(가상 스레드, JPA, Eureka, Actuator, JWT)은 core-service 의 tspoon-defaults.yml 참고
server:
  port: 8086

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notification_db
  kafka:
    consumer:
      # 소비자 그룹이 처음 붙거나 오래 꺼져 있던 동안 쌓인 이벤트도 처음부터 읽는다
      auto-offset-reset: earliest
  # 로컬·CI 는 docker compose 의 Mailpit(인증·TLS 없음, http://localhost:8025 에서 확인).
  # 실제 SMTP(예: Gmail 587)는 환경변수로 바꾼다
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

tspoon:
  notification:
    mail-from: ${MAIL_FROM:no-reply@tspoon.local}
    # 메일 속 링크(이메일 인증 등)가 가리킬 웹 주소
    web-base-url: ${WEB_BASE_URL:http://localhost:3000}

# 메일 서버 상태가 서비스 준비 상태(health)를 좌우하지 않게 한다 — 발송 실패는 알림 상태(FAILED)로 남는다
management:
  health:
    mail:
      enabled: false

logging:
  level:
    com.tspoon: DEBUG
