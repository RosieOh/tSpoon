server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    # 서비스가 뜬 뒤 Gateway 가 라우팅하기까지의 지연을 줄인다 (기본: 레지스트리 30초 + LB 캐시 35초)
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      server:
        webflux:
          # 각 서비스 컨트롤러가 /api/** 로 매핑되어 있으므로 경로를 그대로 전달한다 (StripPrefix 사용 안 함)
          # 주소 기본값은 Eureka(lb://). Kubernetes 에서는 USER_SERVICE_URI=http://user-service:8081 처럼 Service DNS 로 바꾼다
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/api/users/**,/api/admin/users/**

            - id: community-service
              uri: ${COMMUNITY_SERVICE_URI:lb://community-service}
              predicates:
                - Path=/api/boards/**,/api/comments/**,/api/likes/**

            - id: education-service
              uri: ${EDUCATION_SERVICE_URI:lb://education-service}
              predicates:
                - Path=/api/contents/**

            - id: qna-service
              uri: ${QNA_SERVICE_URI:lb://qna-service}
              predicates:
                - Path=/api/questions/**,/api/answers/**

            - id: event-service
              uri: ${EVENT_SERVICE_URI:lb://event-service}
              predicates:
                - Path=/api/events/**,/api/notices/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:lb://notification-service}
              predicates:
                - Path=/api/notifications/**,/api/admin/notifications/**


            # 서비스별 OpenAPI 문서 — 아래 springdoc.swagger-ui.urls 가 이 경로를 모아 보여 준다
            - id: user-service-docs
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/docs/user-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

            - id: community-service-docs
              uri: ${COMMUNITY_SERVICE_URI:lb://community-service}
              predicates:
                - Path=/docs/community-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

            - id: education-service-docs
              uri: ${EDUCATION_SERVICE_URI:lb://education-service}
              predicates:
                - Path=/docs/education-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

            - id: qna-service-docs
              uri: ${QNA_SERVICE_URI:lb://qna-service}
              predicates:
                - Path=/docs/qna-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

            - id: event-service-docs
              uri: ${EVENT_SERVICE_URI:lb://event-service}
              predicates:
                - Path=/docs/event-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

            - id: notification-service-docs
              uri: ${NOTIFICATION_SERVICE_URI:lb://notification-service}
              predicates:
                - Path=/docs/notification-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

          # CORS 는 Gateway 에서만 처리한다 (서비스는 비활성화)
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600

tspoon:
  jwt:
    # 도메인 서비스와 같은 비밀키를 써야 한다 (docker compose 에서는 JWT_SECRET 으로 함께 넘김)
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-0123456789}
  gateway:
    auth:
      # 로그인·가입·재발급·이메일 인증·비밀번호 재설정 요청에 만료된 Access Token 이 헤더로 따라와도 막지 않는다
      skip-paths:
        - /api/users/login
        - /api/users/register
        - /api/users/token/refresh
        - /api/users/email-verification/confirm
        - /api/users/email-verification/resend
        - /api/users/password-reset/request
        - /api/users/password-reset/confirm
    # 인증 관련 API 의 클라이언트 IP 별 요청 제한 (AuthRateLimitProperties)
    # 토큰 버킷: 초당 replenish-rate 개씩 채워지고 burst-capacity 개까지 한꺼번에 쓸 수 있다. 넘으면 429
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      replenish-rate: ${AUTH_RATE_LIMIT_REPLENISH_RATE:2}
      burst-capacity: ${AUTH_RATE_LIMIT_BURST_CAPACITY:30}
      # 앞단 프록시(로드밸런서·Ingress) 수. 0 이면 X-Forwarded-For 를 믿지 않는다
      trusted-proxies: ${AUTH_RATE_LIMIT_TRUSTED_PROXIES:0}
      paths:
        - /api/users/login
        - /api/users/register
        - /api/users/token/refresh
        - /api/users/email-verification/**
        - /api/users/password-reset/**

# 서비스별 문서를 한곳에서: http://localhost:8080/swagger-ui.html
# 운영에서 숨기려면 SPRINGDOC_SWAGGER_UI_ENABLED=false, SPRINGDOC_API_DOCS_ENABLED=false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 회원 (user-service)
        url: /docs/user-service/v3/api-docs
      - name: 커뮤니티 (community-service)
        url: /docs/community-service/v3/api-docs
      - name: 교육 콘텐츠 (education-service)
        url: /docs/education-service/v3/api-docs
      - name: Q&A (qna-service)
        url: /docs/qna-service/v3/api-docs
      - name: 행사 (event-service)
        url: /docs/event-service/v3/api-docs
      - name: 알림 (notification-service)
        url: /docs/notification-service/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      # 로컬·학습용으로 모든 요청을 추적한다. 운영에서는 낮춘다 (MANAGEMENT_TRACING_SAMPLING_PROBABILITY)
      probability: 1.0
  otlp:
    metrics:
      export:
        # OTLP 수집기가 있을 때만 켠다 (compose.observability.yaml). 트레이스·로그는 주소를 줄 때만 내보낸다
        enabled: false
