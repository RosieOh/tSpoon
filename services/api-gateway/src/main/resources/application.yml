server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    # 서비스가 뜬 뒤 Gateway 가 라우팅하기까지의 지연을 줄인다 (기본: 레지스트리 30초 + LB 캐시 35초)
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      server:
        webflux:
          # 각 서비스 컨트롤러가 /api/** 로 매핑되어 있으므로 경로를 그대로 전달한다 (StripPrefix 사용 안 함)
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**

            - id: community-service
              uri: lb://community-service
              predicates:
                - Path=/api/boards/**,/api/comments/**,/api/likes/**

            - id: education-service
              uri: lb://education-service
              predicates:
                - Path=/api/contents/**,/api/courses/**,/api/materials/**

            - id: qna-service
              uri: lb://qna-service
              predicates:
                - Path=/api/questions/**,/api/answers/**

            - id: event-service
              uri: lb://event-service
              predicates:
                - Path=/api/events/**,/api/notices/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**

          # CORS 는 Gateway 에서만 처리한다 (서비스는 비활성화)
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
