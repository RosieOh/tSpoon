# 공통 기본값(가상 스레드, JPA, Eureka, Actuator, JWT)은 core-service 의 tspoon-defaults.yml 참고
server:
  port: 8082

spring:
  application:
    name: community-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/community_db

tspoon:
  security:
    public-get-paths:
      - /api/boards/**

logging:
  level:
    com.tspoon: DEBUG
