name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 PR 에 새 커밋이 올라오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # 단위 테스트 + Testcontainers(PostgreSQL) 통합 테스트
      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: services/*/build/reports/tests/
          retention-days: 7

  e2e:
    name: e2e
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADMIN_EMAIL: admin@tspoon.local
      ADMIN_PASSWORD: ci-admin-password
      JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build jars
        run: ./gradlew bootJar --console=plain

      # 9개 컨테이너가 모두 healthy 가 될 때까지 기다린다
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Run E2E through API Gateway
        run: python3 scripts/e2e.py

      # 알림 서비스를 멈춘 사이 발생한 이벤트도 재시작 뒤 알림이 되는지 (outbox + Kafka)
      - name: Run outbox resilience scenario
        run: python3 scripts/e2e.py outbox-resilience

      - name: Collect compose logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color > compose.log

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose.log
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose down -v
