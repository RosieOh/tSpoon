pluginManagement {
    includeBuild 'build-logic'
}

plugins {
    // 로컬에 JDK 25가 없으면 Gradle이 자동으로 내려받는다
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'tspoon-msa'

// 공유 라이브러리
include 'services:auth-support'
include 'services:observability-support'
include 'services:outbox-support'
include 'services:core-service'

// 인프라
include 'services:eureka-server'
include 'services:api-gateway'

// 도메인 서비스
include 'services:user-service'
include 'services:community-service'
include 'services:education-service'
include 'services:qna-service'
include 'services:event-service'
include 'services:notification-service'
